<header class="customer-header">
  <div class="customer-header__content">
    <a class="brand" routerLink="/" [attr.aria-label]="copy().brand.homeLabel">
      <span class="brand__mark" aria-hidden="true">ب</span>
      <span class="brand__text">
        <strong>{{ copy().brand.name }}</strong>
        <small>{{ copy().brand.tagline }}</small>
      </span>
    </a>

    <div class="customer-header__actions">
      @if (activeOrderCode(); as code) {
        <a
          class="active-order-link"
          [routerLink]="['/order', code, 'track']"
          [attr.aria-label]="copy().brand.trackActiveOrder"
        >
          <span class="active-order-link__indicator" aria-hidden="true"></span>
          <span>{{ copy().brand.trackActiveOrder }}</span>
        </a>
      }

      <a class="orders-link" routerLink="/orders">
        <span>{{ copy().brand.orders }}</span>
      </a>

      <div class="language-switcher" role="group" [attr.aria-label]="copy().brand.languageLabel">
        <button
          type="button"
          data-language="ar"
          [class.is-active]="language.current() === 'ar'"
          [attr.aria-pressed]="language.current() === 'ar'"
          (click)="setLanguage('ar')"
        >
          {{ copy().brand.arabic }}
        </button>
        <button
          type="button"
          data-language="en"
          [class.is-active]="language.current() === 'en'"
          [attr.aria-pressed]="language.current() === 'en'"
          (click)="setLanguage('en')"
        >
          {{ copy().brand.english }}
        </button>
      </div>

      <a class="cart-link" routerLink="/cart">
        <span>{{ copy().brand.cart }}</span>
        <strong aria-live="polite">{{ cart.itemCount() }}</strong>
      </a>
    </div>
  </div>
</header>
