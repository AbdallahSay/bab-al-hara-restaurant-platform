<main class="signin-shell">
  <div class="signin-card">
    <header class="signin-header">
      <div class="brand-row">
        <h1 class="brand-title">{{ copy().brand.name }}</h1>
        <div class="lang-switch">
          <button
            type="button"
            class="lang-btn"
            [class.is-active]="language.current() === 'ar'"
            (click)="setLanguage('ar')"
          >
            العربية
          </button>
          <button
            type="button"
            class="lang-btn"
            [class.is-active]="language.current() === 'en'"
            (click)="setLanguage('en')"
          >
            English
          </button>
        </div>
      </div>
      <h2 class="signin-title">{{ copy().management.signInTitle }}</h2>
      <p class="signin-subtitle">{{ copy().management.signInSubtitle }}</p>
    </header>

    @if (error()) {
      <div class="alert alert-error" role="alert">
        <span class="alert-icon" aria-hidden="true">⚠️</span>
        <p>{{ error() }}</p>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="signIn()" class="signin-form">
      <div class="form-group">
        <label for="signin-email">{{ copy().management.email }}</label>
        <input
          id="signin-email"
          type="email"
          formControlName="email"
          autocomplete="username"
          [placeholder]="copy().management.email"
        />
      </div>

      <div class="form-group">
        <label for="signin-password">{{ copy().management.password }}</label>
        <input
          id="signin-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [placeholder]="copy().management.password"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading() || form.invalid"
      >
        @if (loading()) {
          <span class="btn-spinner" aria-hidden="true"></span>
          <span>{{ copy().management.signingIn }}</span>
        } @else {
          <span>{{ copy().management.signIn }}</span>
        }
      </button>
    </form>

    <footer class="signin-footer">
      <a routerLink="/" class="back-link"> ← {{ copy().common.backToMenu }} </a>
    </footer>
  </div>
</main>
