name: bab-al-hara-development

services:
  database:
    image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04@sha256:86cc6144ef39bb0fbed2329e1ad79b13ee82e7b2e4739213a0db0800e668a74a
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file}
    ports:
      - "1433:1433"
    volumes:
      - bab-al-hara-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s

volumes:
  bab-al-hara-sqlserver:
